spring.application.name=p1150512
#修改 server 啟動的 port，預設是 8080
server.port=8083
#設定資料庫連接
# 3306是連接 mysql 的 port；p111150512 是要連接的資料庫名稱
# rewriteBatchedStatements=true: 可以批次新增
spring.datasource.url=jdbc:mysql://localhost:3306/pra?serverTimezone=Asia/Taipei&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

build.gradle
// mysql connector: mysql 驅動
	implementation 'com.mysql:mysql-connector-j'
